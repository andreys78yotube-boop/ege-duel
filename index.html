<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЕГЭ Дуэль</title>
<meta name="description" content="Дуэли и соло-тренировка по заданиям ЕГЭ по профильной математике 2027">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b5bdb'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="window.EGEApp && window.EGEApp.rerender()"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root {
  --bg: #f4f2ee;
  --bg2: #ebe7e0;
  --card: #ffffff;
  --ink: #1d1b19;
  --ink2: #5d5852;
  --ink3: #8e8780;
  --line: #e2ddd5;
  --accent: #3b5bdb;
  --accent-ink: #ffffff;
  --accent-soft: #e6ebfc;
  --ok: #1f8a4c;
  --ok-soft: #e1f3e8;
  --bad: #c92a2a;
  --bad-soft: #fbe5e5;
  --warn: #b8640b;
  --heart: #e03131;
  --shadow: 0 1px 2px rgba(30, 25, 20, .06), 0 6px 24px rgba(30, 25, 20, .06);
  --grid: #e6e1d9;
  --axis: #3a3631;
  --curve: #3b5bdb;
  --curve2: #d9480f;
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --bg2: #1c1f26; --card: #1f232b; --ink: #eceae6; --ink2: #b0aba4; --ink3: #7f7a74;
    --line: #2e333d; --accent: #7b93ff; --accent-ink: #0f1220; --accent-soft: #252c4a;
    --ok: #51cf66; --ok-soft: #1c3324; --bad: #ff6b6b; --bad-soft: #3a1f22; --warn: #ffa94d; --heart: #ff6b6b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .25);
    --grid: #2c313b; --axis: #c9c5bf; --curve: #7b93ff; --curve2: #ff8a50; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --bg2: #1c1f26; --card: #1f232b; --ink: #eceae6; --ink2: #b0aba4; --ink3: #7f7a74;
  --line: #2e333d; --accent: #7b93ff; --accent-ink: #0f1220; --accent-soft: #252c4a;
  --ok: #51cf66; --ok-soft: #1c3324; --bad: #ff6b6b; --bad-soft: #3a1f22; --warn: #ffa94d; --heart: #ff6b6b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .25);
  --grid: #2c313b; --axis: #c9c5bf; --curve: #7b93ff; --curve2: #ff8a50; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }

.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }

/* ---------- шапка ---------- */
header.top {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: "Unbounded", "Manrope", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; cursor: pointer; }
.logo .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 15px; }
.logo small { font-family: "Manrope", sans-serif; font-weight: 600; color: var(--ink3); font-size: 12px; display: block; letter-spacing: 0; margin-top: -3px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--bg2); padding: 4px; border-radius: 12px; }
nav.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--ink2); }
nav.tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.theme-btn { border: 1px solid var(--line); background: var(--card); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; }

main { padding: 28px 0 60px; }
h1, h2, h3 { font-family: "Unbounded", "Manrope", sans-serif; letter-spacing: -.015em; line-height: 1.2; }
h1 { font-size: 30px; margin: 0 0 6px; }
h2 { font-size: 20px; margin: 0 0 14px; }
h3 { font-size: 15px; margin: 0 0 10px; }
.lead { color: var(--ink2); margin: 0 0 24px; max-width: 640px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
.stack > * + * { margin-top: 18px; }

/* ---------- элементы форм ---------- */
.field { margin-bottom: 18px; }
.field > label, .lbl { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
.hint { color: var(--ink3); font-size: 13px; margin-top: 6px; }
.input {
  width: 100%; padding: 11px 14px; border-radius: 11px; border: 1.5px solid var(--line);
  background: var(--bg); outline: none; transition: border-color .15s;
}
.input:focus { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1.5px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 999px;
  cursor: pointer; font-weight: 600; font-size: 14px; transition: all .12s;
}
.chip:hover { border-color: var(--ink3); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.nums { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.num {
  aspect-ratio: 1; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; cursor: pointer;
  font-weight: 800; font-size: 15px; display: grid; place-items: center; position: relative; padding: 0;
}
.num.p2 { background: var(--bg2); }
.num.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.num:disabled { opacity: .55; cursor: default; }
.seg { display: inline-flex; background: var(--bg2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 11px; overflow: hidden; }
.stepper button { border: 0; background: var(--bg2); width: 40px; height: 40px; cursor: pointer; font-size: 20px; font-weight: 700; }
.stepper span { min-width: 64px; text-align: center; font-weight: 800; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sp { flex: 1; }

.btn {
  border: 0; background: var(--accent); color: var(--accent-ink); padding: 12px 20px; border-radius: 12px;
  font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .08s, filter .15s; text-decoration: none;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--line); }
.btn.big { padding: 15px 26px; font-size: 17px; border-radius: 14px; }
.btn.wide { width: 100%; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; }

/* ---------- комната ---------- */
.code-box { text-align: center; padding: 26px 16px; border: 2px dashed var(--line); border-radius: 16px; background: var(--bg); }
.code { font-family: "Unbounded", monospace; font-size: 44px; font-weight: 800; letter-spacing: .12em; }
.share-row { display: flex; gap: 8px; margin-top: 14px; }
.share-row .input { font-size: 13px; }
.waiting { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-weight: 600; }
.dot-pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; flex: none; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
.summary { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.summary dt { color: var(--ink3); }
.summary dd { margin: 0; font-weight: 600; }
.notice { padding: 12px 14px; border-radius: 12px; background: var(--bg2); color: var(--ink2); font-size: 14px; }
.notice.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- игра ---------- */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 16px; }
.player { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.player.right { align-items: flex-end; text-align: right; }
.pname { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pstat { font-size: 13px; color: var(--ink3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.pstat.ok { color: var(--ok); }
.pstat.off { color: var(--bad); }
.hearts { display: flex; gap: 2px; flex-wrap: wrap; }
.player.right .hearts { justify-content: flex-end; }
.heart { width: 20px; height: 20px; color: var(--heart); transition: transform .3s; }
.heart.lost { color: var(--line); }
.heart.pop { animation: pop .6s; }
@keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.5); } 100% { transform: scale(1); } }
.center-hud { text-align: center; }
.round-lbl { font-size: 12px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .08em; }
.timer { font-family: "Unbounded", monospace; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.timer.inf { font-size: 22px; color: var(--ink3); }
.tbar { height: 6px; border-radius: 3px; background: var(--bg2); overflow: hidden; margin-bottom: 16px; }
.tbar i { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
.tbar.low i { background: var(--bad); }

.task-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.badge { background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 4px 10px; border-radius: 8px; font-size: 14px; }
.badge.p2 { background: var(--ink); color: var(--bg); }
.task-topic { color: var(--ink2); font-weight: 600; font-size: 14px; }
.src { margin-left: auto; font-size: 12px; color: var(--ink3); }
.task-text { font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }
.task-text p { margin: 0 0 10px; }
.task-text ul { margin: 0 0 10px; padding-left: 22px; }
.task-text .note { font-size: 13px; color: var(--ink3); background: var(--bg2); padding: 8px 12px; border-radius: 10px; margin-top: 12px; }
.task-text code { font-family: ui-monospace, Consolas, monospace; background: var(--card); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.katex { font-size: 1.07em; }
.katex-display { overflow-x: auto; overflow-y: hidden; }
.plot { display: block; width: 100%; max-width: 440px; margin: 10px auto 14px; height: auto; }
.g-grid { stroke: var(--grid); stroke-width: 1; }
.g-axis { stroke: var(--axis); stroke-width: 1.6; }
.g-arrow { fill: var(--axis); }
.g-curve { stroke: var(--curve); stroke-width: 2.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.g-curve2 { stroke: var(--curve2); stroke-width: 2.2; fill: none; }
.g-dash { stroke: var(--ink3); stroke-width: 1.3; stroke-dasharray: 4 4; }
.g-dot { fill: var(--ink); }
.g-open { fill: var(--card); stroke: var(--curve); stroke-width: 2; }
.g-lbl { fill: var(--ink2); font: 600 12px "Manrope", sans-serif; }
.g-lbl-b { fill: var(--ink); font-weight: 800; }

.answer-box { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.answer-row { display: flex; gap: 10px; }
.answer-row .input { font-size: 18px; font-weight: 700; padding: 13px 16px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.keys button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 9px; min-width: 40px; height: 36px; cursor: pointer; font-weight: 700; padding: 0 10px; }
.ferr { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1em; font-weight: 600; }
.sent { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--accent-soft); color: var(--accent); border-radius: 12px; font-weight: 700; }

.verdicts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.verdicts.solo { grid-template-columns: 1fr; }
.verdict { border-radius: 14px; padding: 14px 16px; border: 1.5px solid var(--line); }
.verdict.ok { background: var(--ok-soft); border-color: transparent; }
.verdict.bad { background: var(--bad-soft); border-color: transparent; }
.verdict .who { font-size: 13px; font-weight: 700; color: var(--ink2); }
.verdict .what { font-size: 18px; font-weight: 800; margin-top: 2px; overflow-wrap: anywhere; }
.verdict.ok .what { color: var(--ok); }
.verdict.bad .what { color: var(--bad); }
.verdict .delta { font-size: 13px; font-weight: 700; margin-top: 4px; }
.right-ans { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 15px; margin-bottom: 14px; }
.right-ans b { font-size: 20px; font-family: "Unbounded", sans-serif; }
.sol { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.sol h3 { margin-bottom: 8px; }
.sol .full { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.sol p { margin: 0 0 8px; }
.toggle-full { margin-top: 12px; }
.actions { display: flex; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap; }

.over { text-align: center; padding: 34px 22px; }
.over .big-emoji { font-size: 56px; line-height: 1; }
.over h1 { margin-top: 14px; }
.stats { display: flex; justify-content: center; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; min-width: 120px; }
.stat b { display: block; font-family: "Unbounded", sans-serif; font-size: 24px; }
.stat span { font-size: 13px; color: var(--ink3); font-weight: 600; }
.history { text-align: left; margin-top: 18px; }
.history table { width: 100%; border-collapse: collapse; font-size: 14px; }
.history td, .history th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.history th { color: var(--ink3); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.mk-ok { color: var(--ok); font-weight: 800; }
.mk-bad { color: var(--bad); font-weight: 800; }

.rules ol, .rules ul { padding-left: 20px; }
.rules li { margin-bottom: 6px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 700; z-index: 50;
  transition: all .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.conn { position: fixed; top: 72px; right: 16px; z-index: 20; background: var(--bad-soft); color: var(--bad); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; display: none; }
.conn.show { display: block; }
.hide { display: none !important; }
.muted { color: var(--ink3); }
.mt0 { margin-top: 0; }

@media (max-width: 760px) {
  .grid2 { grid-template-columns: 1fr; }
  header.top .wrap { height: auto; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
  nav.tabs { margin-left: 0; order: 3; width: 100%; }
  nav.tabs button { flex: 1; padding: 7px 6px; }
  .theme-btn { margin-left: auto; }
  h1 { font-size: 24px; }
  .card { padding: 16px; }
  .nums { grid-template-columns: repeat(7, 1fr); }
  .code { font-size: 34px; }
  .verdicts { grid-template-columns: 1fr; }
  .timer { font-size: 22px; }
  .task-text { font-size: 16px; }
  .answer-row { flex-direction: column; }
  .conn { top: auto; bottom: 16px; right: 16px; }
}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo" title="На главную"><span class="mark">∫</span><div>ЕГЭ Дуэль<small>профильная математика · 2027</small></div></div>
    <nav class="tabs">
      <button data-tab="duel">Дуэль</button>
      <button data-tab="solo">Соло</button>
      <button data-tab="rules">Правила</button>
    </nav>
    <button class="theme-btn" id="theme" title="Светлая / тёмная тема" aria-label="Сменить тему">◐</button>
  </div>
</header>
<main><div class="wrap" id="main"></div></main>
<div class="conn" id="conn">Нет связи — переподключаемся…</div>
<div class="toast" id="toast"></div>
<script>
/* ===== Ядро: утилиты, генерация заданий, проверка ответов, графики ===== */
var EGE = (function () {
  const E = { gens: {}, T: String.raw };

  /* ---------- случайность и арифметика ---------- */
  E.rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  E.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  E.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  E.gcd = (a, b) => {
    a = Math.abs(a); b = Math.abs(b);
    while (b) [a, b] = [b, a % b];
    return a;
  };
  E.clean = (x) => Math.round(x * 1e9) / 1e9;
  // конечная десятичная дробь с не более чем d знаками
  E.isNice = (x, d = 4) => {
    if (!isFinite(x)) return false;
    const m = Math.round(x * Math.pow(10, d));
    return Math.abs(m / Math.pow(10, d) - x) < 1e-9;
  };
  // число -> строка с десятичной запятой (для текста)
  E.n = (x) => {
    x = E.clean(x);
    let s = String(x);
    if (s.indexOf('e') >= 0) s = x.toFixed(9).replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  };
  // число -> TeX
  E.t = (x) => E.n(x).replace(',', '{,}');
  // дробь p/q в TeX (сокращённая)
  E.frac = (p, q, display) => {
    if (q < 0) { p = -p; q = -q; }
    const g = E.gcd(p, q) || 1;
    p /= g; q /= g;
    if (q === 1) return String(p);
    const f = (display ? '\\dfrac' : '\\frac') + '{' + Math.abs(p) + '}{' + q + '}';
    return (p < 0 ? '-' : '') + f;
  };
  // многочлен из пар [коэффициент, 'x^2'] -> TeX
  E.poly = (terms) => {
    let s = '';
    terms.forEach(([c, v]) => {
      c = E.clean(c);
      if (c === 0) return;
      const neg = c < 0;
      const a = Math.abs(c);
      let body = v ? (a === 1 ? '' : E.t(a)) + v : E.t(a);
      if (s === '') s = (neg ? '-' : '') + body;
      else s += (neg ? ' - ' : ' + ') + body;
    });
    return s || '0';
  };
  // "+ 5" / "- 5" для подстановки
  E.sgn = (c, v = '') => {
    c = E.clean(c);
    if (c === 0) return '';
    const a = Math.abs(c);
    return (c < 0 ? ' - ' : ' + ') + (v && a === 1 ? '' : E.t(a)) + v;
  };
  E.par = (x) => (x < 0 ? '(' + E.t(x) + ')' : E.t(x));

  /* ---------- реестр заданий ---------- */
  E.add = (num, id, fn, opts = {}) => {

    const head = T`<p>На рисунке изображён график $y = f'(x)$ — производной функции $f(x)$, определённой на интервале $(${a};\,${b})$.</p>`;
    const listZ = zeros.map((z, i) => `$x = ${z}$ (${kinds[i] === 'max' ? 'знак меняется с «+» на «−» — максимум' : kinds[i] === 'min' ? 'знак меняется с «−» на «+» — минимум' : 'знак не меняется — не экстремум'})`).join('; ');
    if (q <= 1) {
      // отрезок [p;r]
      const p = rnd(-6, -2), r = rnd(2, 6);
      const inside = zeros.map((z, i) => ({ z, k: kinds[i] })).filter((o) => o.z >= p && o.z <= r);
      const want = q === 0 ? pick(['max', 'min', 'ext']) : 'ext';
      const cnt = inside.filter((o) => (want === 'ext' ? o.k !== 'none' : o.k === want)).length;
      const what = want === 'max' ? 'точек максимума' : want === 'min' ? 'точек минимума' : 'точек экстремума';
      return {
        text: head + T`<p>Найдите количество ${what} функции $f(x)$, принадлежащих отрезку $[${p};\,${r}]$.</p>`,
        svg, answer: cnt,
        short: T`${want === 'max' ? 'Точки максимума — где $f\'$ меняет знак с «+» на «−»' : want === 'min' ? 'Точки минимума — где $f\'$ меняет знак с «−» на «+»' : 'Точки экстремума — где $f\'$ меняет знак'}; на $[${p};\,${r}]$ их $${cnt}$.`,
        full: T`<p>${want === 'max' ? 'В точке максимума производная меняет знак с «+» на «−».' : want === 'min' ? 'В точке минимума производная меняет знак с «−» на «+».' : 'В точке экстремума производная обращается в ноль и меняет знак.'} Если производная обращается в ноль, но знак не меняет, экстремума нет.</p><p>Нули производной на графике: ${listZ}.</p><p>На отрезке $[${p};\,${r}]$ подходящих точек: $${cnt}$.</p>` + ans(cnt),
      };
    }
    if (q === 2) {
      // единственная точка экстремума на отрезке
      const ext = zeros.map((z, i) => ({ z, k: kinds[i], i })).filter((o) => o.k !== 'none');
      if (!ext.length) return null;
      const e = pick(ext);
      const prev = ext.filter((o) => o.z < e.z).pop();
      const next = ext.find((o) => o.z > e.z);
      const lo = prev ? prev.z + 1 : -6, hi = next ? next.z - 1 : 6;
      if (lo > e.z || hi < e.z) return null;
      const p = rnd(lo, e.z), r = rnd(e.z, hi);
      if (p === r) return null;
      const w = e.k === 'max' ? 'максимума' : 'минимума';
      return {
        text: head + T`<p>Найдите точку ${w} функции $f(x)$ на отрезке $[${p};\,${r}]$.</p>`,
        svg, answer: e.z,
        short: T`В точке $x = ${e.z}$ производная меняет знак ${e.k === 'max' ? 'с «+» на «−»' : 'с «−» на «+»'}.`,
        full: T`<p>В точке ${w} производная равна нулю и меняет знак ${e.k === 'max' ? 'с «+» на «−»' : 'с «−» на «+»'}.</p><p>Нули производной: ${listZ}.</p><p>На отрезке $[${p};\,${r}]$ такая точка одна: $x = ${e.z}$.</p>` + ans(e.z),
      };
    }
    // знакопостоянный участок -> наибольшее/наименьшее значение на отрезке
    const segs = [];
    for (let i = 0; i <= zeros.length; i++) {
      const L = i === 0 ? a : zeros[i - 1], R = i === zeros.length ? b : zeros[i];
      const lo = Math.ceil(L + (i === 0 ? 0.5 : 0)), hi = Math.floor(R - (i === zeros.length ? 0.5 : 0));
      if (hi - lo >= 2) segs.push({ lo, hi, s: signs[i] });
    }
    if (!segs.length) return null;
    const sg = pick(segs);
    const p = rnd(sg.lo, sg.hi - 2), r = rnd(p + 2, sg.hi);
    const big = Math.random() < 0.5;
    const res = (sg.s > 0) === big ? r : p;
    return {
      text: head + T`<p>В какой точке отрезка $[${p};\,${r}]$ функция $f(x)$ принимает ${big ? 'наибольшее' : 'наименьшее'} значение?</p>`,
      svg, answer: res,
      short: T`На $[${p};\,${r}]$ $f'(x) ${sg.s > 0 ? '>' : '<'} 0$, функция ${sg.s > 0 ? 'возрастает' : 'убывает'}; ответ $${res}$.`,
      full: T`<p>На отрезке $[${p};\,${r}]$ график производной лежит ${sg.s > 0 ? 'выше' : 'ниже'} оси абсцисс, то есть $f'(x) ${sg.s > 0 ? '>' : '<'} 0$ (касание оси в концах отрезка не влияет на монотонность).</p><p>Значит, $f(x)$ на этом отрезке ${sg.s > 0 ? 'возрастает' : 'убывает'}, и ${big ? 'наибольшее' : 'наименьшее'} значение достигается в ${res === r ? 'правом' : 'левом'} конце: $x = ${res}$.</p>` + ans(res),
    };
  });

  E.add(8, 'motion', () => {
    if (Math.random() < 0.5) {
      const A = rnd(1, 8), B = rnd(-60, 20), C = rnd(-20, 40), t0 = rnd(2, 10);

      return {
        text: T`<p>Материальная точка движется прямолинейно по закону $x(t) = ${E.poly([[A, 't^2'], [B, 't'], [C, '']])}$, где $x$ — расстояние от точки отсчёта в метрах, $t$ — время в секундах, измеренное с начала движения. Найдите её скорость (в м/с) в момент времени $t = ${t0}$ с.</p>`,
        answer: v,
        short: T`$v(t) = x'(t) = ${E.poly([[2 * A, 't'], [B, '']])}$, $v(${t0}) = ${v}$.`,
        full: T`<p>Скорость — производная координаты по времени: $v(t) = x'(t) = ${E.poly([[2 * A, 't'], [B, '']])}$.</p><p>$v(${t0}) = ${2 * A}\cdot ${t0} ${E.sgn(B)} = ${v}$ м/с.</p>` + ans(v),
      };
    }
    const Tm = rnd(3, 12), U = rnd(1, 6), V = rnd(1, 15);
    if ((Tm - U) % 2) return null;
    const p = (Tm - U) / 2; // x = t^3/3 - p t^2 + q t + c
    const q = V - Tm * U;
    const c = rnd(1, 20);
    const vexp = E.poly([[1, 't^2'], [-2 * p, 't'], [q, '']]);
    return {
      text: T`<p>Материальная точка движется прямолинейно по закону $x(t) = \dfrac13 t^3 ${E.sgn(-p, 't^2')} ${E.sgn(q, 't')} ${E.sgn(c)}$, где $x$ — расстояние от точки отсчёта в метрах, $t$ — время в секундах, измеренное с начала движения. В какой момент времени (в секундах) её скорость была равна $${V}$ м/с?</p>`,
      answer: Tm,
      short: T`$v(t) = ${vexp} = ${V}$, $t^2 ${E.sgn(-2 * p, 't')} ${E.sgn(q - V)} = 0$, $t = ${Tm}$ ($t > 0$).`,
      full: T`<p>$v(t) = x'(t) = ${vexp}$.</p><p>$${vexp} = ${V} \iff t^2 ${E.sgn(-2 * p, 't')} ${E.sgn(q - V)} = 0$.</p><p>Корни: $t = ${Tm}$ и $t = ${-U}$. Время неотрицательно, значит $t = ${Tm}$ с.</p>` + ans(Tm),
    };
  });

  /* ---------------- №9 Прикладные задачи ---------------- */
  E.add(9, 'ball', () => {
    const t1 = pick([0.2, 0.4, 0.5, 0.6, 0.8, 1]);
    const dt = pick([0.4, 0.6, 0.8, 1, 1.2, 1.4, 1.6, 2]);
    const t2 = E.clean(t1 + dt);
    const v = E.clean(5 * (t1 + t2));
    const h0 = pick([0, 1, 1.2, 1.4, 1.6, 2]);
    const H = E.clean(h0 + 5 * t1 * t2);
    if (!E.isNice(H, 2) || !E.isNice(v, 2)) return null;
    return {
      text: T`<p>Мяч бросили вертикально вверх. Пока мяч не упал, высота, на которой он находится, описывается формулой $h(t) = ${E.poly([[h0, ''], [v, 't'], [-5, 't^2']])}$ ($h$ — высота в метрах, $t$ — время в секундах, прошедшее с момента броска). Сколько секунд мяч находился на высоте не менее $${t(H)}$ метров?</p>`,
      answer: dt,
      short: T`$5t^2 - ${t(v)}t + ${t(E.clean(H - h0))} \le 0$, $t\in[${t(t1)};\,${t(t2)}]$, длительность $${t(dt)}$ с.`,
      full: T`<p>Решим неравенство $h(t) \ge ${t(H)}$: $${E.poly([[h0, ''], [v, 't'], [-5, 't^2']])} \ge ${t(H)}$, то есть $5t^2 - ${t(v)}t + ${t(E.clean(H - h0))} \le 0$.</p><p>Корни квадратного трёхчлена: $t_1 = ${t(t1)}$, $t_2 = ${t(t2)}$ (проверьте по теореме Виета: $t_1 + t_2 = ${t(E.clean(v / 5))}$, $t_1 t_2 = ${t(E.clean((H - h0) / 5))}$).</p><p>Мяч находится на нужной высоте при $t\in[${t(t1)};\,${t(t2)}]$, то есть $${t(t2)} - ${t(t1)} = ${t(dt)}$ с.</p>` + ans(dt),
    };
  });

  E.add(9, 'current', () => {
    const U = 220;

      text: T`<p>Сила тока в цепи $I$ (в амперах) определяется напряжением в цепи и сопротивлением электроприбора по закону Ома: $I = \dfrac{U}{R}$, где $U$ — напряжение в вольтах, $R$ — сопротивление в омах. В электросеть включён предохранитель, который плавится, если сила тока превышает $${I}$ А. Определите, какое минимальное сопротивление должно быть у электроприбора, подключаемого к розетке в $220$ вольт, чтобы сеть продолжала работать. Ответ дайте в омах.</p>`,
      answer: R,
      short: T`$\dfrac{220}{R} \le ${I} \Rightarrow R \ge ${t(R)}$.`,
      full: T`<p>Сеть работает, пока $I \le ${I}$: $\dfrac{220}{R} \le ${I}$.</p><p>Так как $R > 0$, получаем $R \ge \dfrac{220}{${I}} = ${t(R)}$ Ом. Минимальное сопротивление — $${t(R)}$ Ом.</p>` + ans(R),

  E.add(9, 'lens', () => {
    const F = pick([10, 12, 15, 20, 24, 30, 36, 40]);
    const opts = [];
    for (let d = F + 1; d <= 4 * F; d++) { const f = (F * d) / (d - F); if (Number.isInteger(f) && f > d && f <= 300) opts.push([d, f]); }
    if (!opts.length) return null;
    const [d, f] = pick(opts);
    return {
      text: T`<p>Для получения на экране увеличенного изображения лампочки в лаборатории используется собирающая линза с главным фокусным расстоянием $F = ${F}$ см. Расстояние $d_1$ от линзы до лампочки и расстояние $d_2$ от линзы до экрана связаны соотношением $\dfrac{1}{d_1} + \dfrac{1}{d_2} = \dfrac{1}{F}$. Экран расположен на расстоянии $d_2 = ${f}$ см от линзы. На каком расстоянии от линзы нужно поместить лампочку, чтобы её изображение на экране было чётким? Ответ дайте в сантиметрах.</p>`,
      answer: d,
      short: T`$\dfrac{1}{d_1} = \dfrac{1}{${F}} - \dfrac{1}{${f}}$, $d_1 = \dfrac{${F}\cdot ${f}}{${f} - ${F}} = ${d}$.`,
      full: T`<p>$\dfrac{1}{d_1} = \dfrac{1}{F} - \dfrac{1}{d_2} = \dfrac{d_2 - F}{F d_2}$.</p><p>$d_1 = \dfrac{F d_2}{d_2 - F} = \dfrac{${F}\cdot ${f}}{${f} - ${F}} = \dfrac{${F * f}}{${f - F}} = ${d}$ см.</p>` + ans(d),
    };
  });

  E.add(9, 'horizon', () => {
    const Ls = [4, 8, 12, 16, 20, 24, 32, 40, 48];
    const h = (l) => (l * l) / 12.8;
    if (Math.random() < 0.5) {

      return {
        text: T`<p>Расстояние (в километрах) от наблюдателя, находящегося на высоте $h$ метров над землёй, до видимой им линии горизонта вычисляется по формуле $l = \sqrt{\dfrac{Rh}{500}}$, где $R = 6400$ км — радиус Земли. С какой высоты горизонт виден на расстоянии $${l}$ километров? Ответ дайте в метрах.</p>`,
        answer: h(l),
        short: T`$${l}^2 = \dfrac{6400h}{500} = 12{,}8h$, $h = ${t(h(l))}$.`,
        full: T`<p>Возведём формулу в квадрат: $l^2 = \dfrac{6400h}{500} = 12{,}8h$.</p><p>$h = \dfrac{${l}^2}{12{,}8} = \dfrac{${l * l}}{12{,}8} = ${t(h(l))}$ м.</p>` + ans(h(l)),
      };
    }
    let i = rnd(0, Ls.length - 2), j = rnd(i + 1, Math.min(i + 3, Ls.length - 1));
    const l1 = Ls[i], l2 = Ls[j];
    const r = E.clean(h(l2) - h(l1));
    return {
      text: T`<p>Расстояние (в километрах) от наблюдателя, находящегося на высоте $h$ метров над землёй, до видимой им линии горизонта вычисляется по формуле $l = \sqrt{\dfrac{Rh}{500}}$, где $R = 6400$ км — радиус Земли. Человек, стоящий на пляже, видит горизонт на расстоянии $${l1}$ км. На сколько метров нужно подняться человеку, чтобы расстояние до горизонта увеличилось до $${l2}$ километров?</p>`,
      answer: r,
      short: T`$h = \dfrac{l^2}{12{,}8}$: $h_1 = ${t(h(l1))}$, $h_2 = ${t(h(l2))}$, разность $${t(r)}$.`,
      full: T`<p>Из формулы $l^2 = 12{,}8h$ получаем $h = \dfrac{l^2}{12{,}8}$.</p><p>$h_1 = \dfrac{${l1 * l1}}{12{,}8} = ${t(h(l1))}$ м, $h_2 = \dfrac{${l2 * l2}}{12{,}8} = ${t(h(l2))}$ м.</p><p>Подняться нужно на $${t(h(l2))} - ${t(h(l1))} = ${t(r)}$ м.</p>` + ans(r),
    };
  });

  /* ---------------- №10 Текстовые задачи ---------------- */
  const lcm = (a, b) => (a * b) / E.gcd(a, b);
  E.add(10, 'river', () => {
    const u = rnd(1, 5), v = rnd(u + 4, 30);
    const L = lcm(v + u, v - u);
    const ks = [];
    for (let S = L; S <= 400; S += L) if (S >= 40) ks.push(S);
    if (!ks.length) return null;
    const S = pick(ks), st = rnd(2, 10);
    const total = S / (v + u) + S / (v - u) + st;
    if (total > 60) return null;
    const tt = total - st;
    return {
      text: T`<p>Теплоход проходит по течению реки до пункта назначения $${S}$ км и после стоянки возвращается в пункт отправления. Найдите скорость теплохода в неподвижной воде, если скорость течения равна $${u}$ км/ч, стоянка длится $${st}$ часов, а в пункт отправления теплоход возвращается через $${total}$ часов после отплытия из него. Ответ дайте в км/ч.</p>`,
      answer: v,
      short: T`$\dfrac{${S}}{v + ${u}} + \dfrac{${S}}{v - ${u}} = ${tt}$, $v = ${v}$.`,
      full: T`<p>Пусть $v$ км/ч — скорость теплохода в неподвижной воде ($v > ${u}$). В пути теплоход был $${total} - ${st} = ${tt}$ ч.</p><p>$\dfrac{${S}}{v + ${u}} + \dfrac{${S}}{v - ${u}} = ${tt}$.</p><p>$${S}(v - ${u}) + ${S}(v + ${u}) = ${tt}(v^2 - ${u * u})$, то есть $${tt}v^2 - ${2 * S}v - ${tt * u * u} = 0$.</p><p>Положительный корень: $v = ${v}$ (второй корень отрицателен). Проверка: $\dfrac{${S}}{${v + u}} + \dfrac{${S}}{${v - u}} = ${S / (v + u)} + ${S / (v - u)} = ${tt}$.</p>` + ans(v),
    };
  });

  E.add(10, 'cars', () => {
    const v = rnd(8, 20), d = rnd(20, 70), tm = rnd(1, 6);
    const S = (tm * v * (v + d)) / d;
    if (!Number.isInteger(S) || S < 20 || S > 400) return null;
    return {
      text: T`<p>Из пункта A в пункт B, расстояние между которыми $${S}$ км, одновременно выехали автомобилист и велосипедист. Известно, что за час автомобилист проезжает на $${d}$ км больше, чем велосипедист. Определите скорость велосипедиста, если известно, что он прибыл в пункт B на $${tm}$ ${tm === 1 ? 'час' : tm < 5 ? 'часа' : 'часов'} позже автомобилиста. Ответ дайте в км/ч.</p>`,
      answer: v,
      short: T`$\dfrac{${S}}{v} - \dfrac{${S}}{v + ${d}} = ${tm}$, $v = ${v}$.`,
      full: T`<p>Пусть $v$ км/ч — скорость велосипедиста, тогда скорость автомобилиста $v + ${d}$ км/ч.</p><p>$\dfrac{${S}}{v} - \dfrac{${S}}{v + ${d}} = ${tm}$ $\Rightarrow$ $${S}\cdot ${d} = ${tm}v(v + ${d})$ $\Rightarrow$ $${E.poly([[tm, 'v^2'], [tm * d, 'v'], [-S * d, '']])} = 0$.</p><p>Положительный корень $v = ${v}$. Проверка: $\dfrac{${S}}{${v}} - \dfrac{${S}}{${v + d}} = ${n(S / v)} - ${n(S / (v + d))} = ${tm}$.</p>` + ans(v),
    };
  });

  E.add(10, 'mixture', () => {
    for (let tries = 0; tries < 400; tries++) {
      const a = 5 * rnd(2, 18), b = 5 * rnd(2, 18);
      if (a === b) continue;
      const x = rnd(2, 40), y = rnd(2, 40), m = rnd(2, 20), d = pick([50, 60, 70, 80, 90]);
      const M = x + y + m;
      const c = (a * x + b * y) / M, e = (a * x + b * y + d * m) / M;
      if (!Number.isInteger(c) || !Number.isInteger(e)) continue;
      return {
        text: T`<p>Смешав $${a}\%$-й и $${b}\%$-й растворы кислоты и добавив $${m}$ кг чистой воды, получили $${c}\%$-й раствор кислоты. Если бы вместо $${m}$ кг воды добавили $${m}$ кг $${d}\%$-го раствора той же кислоты, то получили бы $${e}\%$-й раствор кислоты. Сколько килограммов $${a}\%$-го раствора использовали для получения смеси?</p>`,
        answer: x,
        short: T`$\begin{cases} ${a / 100}x + ${b / 100}y = ${c / 100}(x + y + ${m})\\ ${a / 100}x + ${b / 100}y + ${E.clean(d * m / 100)} = ${e / 100}(x + y + ${m})\end{cases}$ $\Rightarrow x = ${x}$.`.replace(/(\d)\.(\d)/g, '$1{,}$2'),
        full: T`<p>Пусть взяли $x$ кг $${a}\%$-го и $y$ кг $${b}\%$-го раствора. Масса смеси в обоих случаях $x + y + ${m}$ кг.</p><p>Вычтем из второго уравнения первое (кислоты больше на $${E.clean(d * m / 100)}$ кг): $${E.clean(d * m / 100)} = ${E.clean((e - c) / 100)}(x + y + ${m})$, откуда $x + y + ${m} = ${M}$, $x + y = ${x + y}$.</p><p>Из первого уравнения: $${a / 100}x + ${b / 100}y = ${E.clean(c * M / 100)}$. Подставим $y = ${x + y} - x$ и найдём $x = ${x}$ (тогда $y = ${y}$).</p>`.replace(/(\d)\.(\d)/g, '$1{,}$2') + ans(x),
      };
    }
    return null;
  });

  E.add(10, 'pipes', () => {
    const y = rnd(4, 40), D = rnd(1, 30);
    const Tt = (y * (y + D)) / (2 * y + D);
    if (!E.isNice(Tt, 1)) return null;
    return {
      text: T`<p>Первая труба наполняет резервуар на $${D}$ минут дольше, чем вторая. Обе трубы, работая одновременно, наполняют этот же резервуар за $${t(Tt)}$ минуты. За сколько минут наполняет этот резервуар одна вторая труба?</p>`,

  E.add(12, 'cubic', () => {
    let r1 = rnd(-6, 6), r2 = rnd(-6, 6);
    if (r1 === r2 || (r1 + r2) % 2) return null;
    if (r1 > r2) [r1, r2] = [r2, r1];
    const S = r1 + r2, P = r1 * r2, C0 = rnd(-20, 20);
    const sg = pick([1, -1]);
    const c3 = sg, c2 = (-3 * S * sg) / 2, c1 = 3 * P * sg;
    const y = (x) => c3 * x ** 3 + c2 * x * x + c1 * x + C0;
    const ex = E.poly([[c3, 'x^3'], [c2, 'x^2'], [c1, 'x'], [C0, '']]);
    const dex = E.poly([[3 * c3, 'x^2'], [2 * c2, 'x'], [c1, '']]);
    const maxP = sg > 0 ? r1 : r2, minP = sg > 0 ? r2 : r1;
    if (Math.random() < 0.5) {
      const isMax = Math.random() < 0.5;
      const res = isMax ? maxP : minP;
      return {
        text: T`<p>Найдите точку ${isMax ? 'максимума' : 'минимума'} функции $y = ${ex}$.</p>`,
        answer: res,
        short: T`$y' = ${dex} = ${3 * sg}(x ${E.sgn(-r1)})(x ${E.sgn(-r2)})$; точка ${isMax ? 'максимума' : 'минимума'} $x = ${res}$.`.replace(/\(x \)/g, '(x)'),
        full: T`<p>$y' = ${dex} = ${3 * sg}(x ${E.sgn(-r1)})(x ${E.sgn(-r2)})$.</p><p>Нули производной: $x = ${r1}$ и $x = ${r2}$. Знаки $y'$: ${sg > 0 ? '«+», «−», «+»' : '«−», «+», «−»'} на промежутках $(-\infty;\,${r1})$, $(${r1};\,${r2})$, $(${r2};\,+\infty)$.</p><p>Точка максимума — $x = ${maxP}$ (смена знака с «+» на «−»), точка минимума — $x = ${minP}$.</p>`.replace(/\(x \)/g, '(x)') + ans(res),
      };
    }
    // значение на отрезке, содержащем одну критическую точку
    const cpt = pick([r1, r2]);
    const other = cpt === r1 ? r2 : r1;
    let p, q;
    if (other > cpt) { p = cpt - rnd(1, 3); q = Math.min(cpt + rnd(1, 3), other - 1); }
    else { q = cpt + rnd(1, 3); p = Math.max(cpt - rnd(1, 3), other + 1); }
    if (!(p < cpt && cpt < q)) return null;
    const isMax = cpt === maxP;
    const vals = [p, cpt, q].map((x) => ({ x, v: y(x) }));
    const res = y(cpt);
    if (Math.abs(res) > 400) return null;
    const word = isMax ? 'наибольшее' : 'наименьшее';
    return {
      _chk: () => { let m = isMax ? -Infinity : Infinity; for (let x = p; x <= q + 1e-9; x += (q - p) / 2000) m = isMax ? Math.max(m, y(x)) : Math.min(m, y(x)); return (isMax ? m <= res + 1e-9 : m >= res - 1e-9) && Math.abs(m - res) < 0.05; },
      text: T`<p>Найдите ${word} значение функции $y = ${ex}$ на отрезке $[${p};\,${q}]$.</p>`,
      answer: res,
      short: T`$y' = 0$ при $x = ${r1}, ${r2}$; на отрезке ${isMax ? 'максимум' : 'минимум'} в $x = ${cpt}$: $y(${cpt}) = ${y(cpt)}$.`,
      full: T`<p>$y' = ${dex} = ${3 * sg}(x ${E.sgn(-r1)})(x ${E.sgn(-r2)})$, нули: $${r1}$ и $${r2}$.</p><p>На отрезке $[${p};\,${q}]$ лежит точка $x = ${cpt}$ — точка ${isMax ? 'максимума' : 'минимума'}.</p><p>Сравним значения: ${vals.map((o) => `$y(${o.x}) = ${o.v}$`).join(', ')}.</p><p>${word[0].toUpperCase() + word.slice(1)} значение: $${res}$.</p>`.replace(/\(x \)/g, '(x)') + ans(res),
    };
  });

      return {
        text: cond + T`<p>Известно, что общая сумма выплат после полного погашения кредита на $${P}\%$ больше суммы, взятой в кредит. Найдите $r$.</p>`,
        type: 'expr', answer: r,
        short: T`Переплата $\dfrac{r(n + 1)}{200}S = \dfrac{${nm + 1}r}{200}S = ${t(P / 100)}S$, $r = ${r}$.`,
        full: base + T`<p>По условию переплата составляет $${P}\%$ от $S$: $\dfrac{${nm + 1}r}{200} = ${t(P / 100)}$, откуда $r = \dfrac{${t(P / 100)}\cdot 200}{${nm + 1}} = ${r}$.</p>` + ans(String(r)),

      type: 'expr', answer: total,

      full: base.replace(/\br\b/g, String(r)) + T`<p>При $r = ${r}$ переплата равна $\dfrac{${nm + 1}\cdot ${r}}{200}S = ${t(P / 100)}\cdot ${S} = ${t(E.clean(S * P / 100))}$ тыс. руб.</p><p>Общая сумма выплат: $${S} + ${t(E.clean(S * P / 100))} = ${t(total)}$ тыс. руб.</p>` + ans(n(total) + ' тыс. руб.'),
    };
  });

      full: sol + T`<p>$S = \dfrac{${o.den}}{${o.num}}X = \dfrac{${o.den}}{${o.num}}\cdot ${fmt(X)} = ${fmt(S)}$ рублей.</p>` + ans(S.toLocaleString('ru-RU') + ' руб.'),

  iv(18, 'f18_1', {

    full: T`<p>Построим график $y = |x^2 - 2x - 3| = |(x - 1)^2 - 4|$. Парабола $y = (x - 1)^2 - 4$ пересекает ось абсцисс в точках $-1$ и $3$; часть между ними (где она отрицательна) отражается вверх, и получается «горб» с вершиной $(1;\,4)$.</p><p>Число корней — число точек пересечения графика с горизонтальной прямой $y = a$:</p><p>$a < 0$ — корней нет; $a = 0$ — два корня ($-1$ и $3$); $0 < a < 4$ — четыре корня; $a = 4$ — три корня; $a > 4$ — два корня.</p>` + ans(T`$\{0\}\cup(4;\,+\infty)$`),

/* ===== Онлайн-связь для дуэли =====
   Схема: оба игрока подключаются к публичному MQTT-брокеру по WebSocket (wss).
   Создатель комнаты — «хозяин»: он хранит состояние игры, проверяет ответы и
   рассылает состояние (retained-сообщение). Второй игрок отправляет только свои действия.
   Первая цифра кода комнаты — номер брокера, поэтому оба игрока гарантированно попадают
   на один и тот же сервер. Если брокер недоступен, хозяин автоматически берёт следующий. */
var Net = (function () {
  const BROKERS = [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://test.mosquitto.org:8081/mqtt',
  ];
  const PREFIX = 'egeduel27/v1/';
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  const rid = (n) => { let s = ''; const a = new Uint32Array(n); crypto.getRandomValues(a); for (let i = 0; i < n; i++) s += ALPHA[a[i] % ALPHA.length]; return s; };

  function available() { return typeof window.mqtt !== 'undefined' && typeof window.mqtt.connect === 'function'; }

  function connectOne(idx, role, code, onStatus) {
    return new Promise((resolve, reject) => {
      const base = PREFIX + code + '/';
      const client = window.mqtt.connect(BROKERS[idx], {
        clientId: 'egeduel_' + role[0] + '_' + rid(10),
        keepalive: 12,
        reconnectPeriod: 2000,
        connectTimeout: 8000,
        clean: true,
        resubscribe: true,
        will: { topic: base + 'presence/' + role, payload: '0', qos: 1, retain: true },
      });
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; try { client.end(true); } catch (e) {} reject(new Error('timeout')); } }, 9000);
      client.on('connect', () => {
        client.publish(base + 'presence/' + role, '1', { qos: 1, retain: true });
        if (onStatus) onStatus(true);
        if (!done) { done = true; clearTimeout(timer); resolve(client); }
      });
      client.on('offline', () => onStatus && onStatus(false));
      client.on('close', () => onStatus && onStatus(false));
      client.on('error', (e) => { if (!done) { done = true; clearTimeout(timer); try { client.end(true); } catch (x) {} reject(e); } });
    });
  }

  class Link {
    constructor(client, code, role) {
      this.client = client; this.code = code; this.role = role;
      this.base = PREFIX + code + '/';
      this.handlers = {};
      client.on('message', (topic, payload) => {
        const sub = topic.slice(this.base.length);
        const h = this.handlers[sub];
        if (!h) return;
        const txt = payload.toString();
        let data = txt;
        if (txt && (txt[0] === '{' || txt[0] === '[')) { try { data = JSON.parse(txt); } catch (e) { return; } }
        h(data);
      });
    }
    on(sub, fn) { this.handlers[sub] = fn; this.client.subscribe(this.base + sub, { qos: 1 }); }
    send(sub, obj, opts = {}) {
      const payload = typeof obj === 'string' ? obj : JSON.stringify(obj);
      this.client.publish(this.base + sub, payload, { qos: opts.qos === undefined ? 1 : opts.qos, retain: !!opts.retain });
    }
    clear(sub) { this.client.publish(this.base + sub, '', { qos: 1, retain: true }); }
    close() {
      try { this.client.publish(this.base + 'presence/' + this.role, '0', { qos: 1, retain: true }); } catch (e) {}
      const c = this.client;
      setTimeout(() => { try { c.end(false); } catch (e) {} }, 400);
    }
  }

  // Хозяин: перебираем брокеры, пока какой-то не ответит
  async function host(onStatus) {
    if (!available()) throw new Error('nolib');
    let lastErr;
    for (let i = 0; i < BROKERS.length; i++) {
      const code = String(i + 1) + rid(5);
      try {
        const c = await connectOne(i, 'host', code, onStatus);
        return new Link(c, code, 'host');
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('no broker');
  }

  async function hostExisting(code, onStatus) {
    if (!available()) throw new Error('nolib');
    const idx = +code[0] - 1;
    const c = await connectOne(idx, 'host', code, onStatus);
    return new Link(c, code, 'host');
  }

  async function join(code, onStatus) {
    if (!available()) throw new Error('nolib');
    const idx = +code[0] - 1;
    if (!(idx >= 0 && idx < BROKERS.length)) throw new Error('badcode');
    const c = await connectOne(idx, 'guest', code, onStatus);
    return new Link(c, code, 'guest');
  }

  function normCode(s) {
    return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  }
  function validCode(c) { return /^[1-3][A-Z2-9]{5}$/.test(c); }

  return { host, hostExisting, join, normCode, validCode, rid, available, BROKERS };
})();

  const hearts = (n, max) => {
    let s = '<div class="hearts" aria-label="' + n + ' ' + livesWord(n) + '">';
    for (let i = 0; i < max; i++) s += HEART.replace('class="heart"', 'class="heart' + (i >= n ? ' lost' : '') + '"');
    return s + '</div>';
  };
  const fmtTime = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  /* ======================================================================
     ИГРОВАЯ ЛОГИКА (общая для соло и для хозяина дуэли)
     ====================================================================== */
  function newState(settings, hostName, code) {
    return {
      v: 1, seq: 0, code: code || null, settings: Object.assign({}, settings),
      phase: code ? 'lobby' : 'ready', round: 0,
      players: { host: { name: hostName, lives: settings.lives, answered: false, ready: false }, guest: null },
      task: null, deadline: 0, result: null, history: [], winner: null, reason: null,
    };
  }
  const roles = (S) => (S.players.guest ? ['host', 'guest'] : ['host']);
  const isSolo = (S) => !S.code;

  function pickNum(S, P) {
    const st = S.settings;
    const list = st.mode === 'all' ? ALL : st.nums.slice().sort((a, b) => a - b);
    if (st.mode !== 'all' && st.order === 'seq') return list[(S.round - 1) % list.length];
    let c = list.filter((x) => x !== P.lastNum);
    if (!c.length) c = list;
    return c[Math.floor(Math.random() * c.length)];
  }

  function startRound(S, P) {
    S.round++;
    let t = null, num = pickNum(S, P);
    for (let i = 0; i < 5 && !t; i++) {
      try { t = E.make(num); } catch (e) { num = pickNum(S, P); }
    }
    P.lastNum = num;
    P.task = t;
    P.answers = {};
    S.task = { num, gid: t.gid, text: t.text, svg: t.svg || '', type: t.type, source: t.source };
    S.phase = 'question';
    S.deadline = S.settings.time ? Date.now() + S.settings.time * 1000 : 0;
    S.result = null;
    roles(S).forEach((r) => { S.players[r].answered = false; S.players[r].ready = false; });
  }

  function submitAnswer(S, P, role, value) {
    if (S.phase !== 'question' || !S.players[role] || S.players[role].answered) return false;
    const grace = role === 'guest' ? GRACE : 400;
    if (S.deadline && Date.now() > S.deadline + grace) return false;
    P.answers[role] = { value: String(value).slice(0, 200) };
    S.players[role].answered = true;
    if (roles(S).every((r) => S.players[r].answered)) finishRound(S, P);
    return true;
  }

  function finishRound(S, P) {
    if (S.phase !== 'question') return;
    const t = P.task;
    const v = {}, h = { round: S.round, num: t.num };
    roles(S).forEach((r) => {
      const a = P.answers[r];
      const ok = a ? E.check(t, a.value) : false;
      v[r] = { value: a ? a.value : null, ok, timeout: !a };
      if (!ok) S.players[r].lives = Math.max(0, S.players[r].lives - 1);
      h[r] = ok;
    });
    S.history.push(h);
    S.result = { answer: E.answerText(t), short: t.short, full: t.full, v };
    S.deadline = 0;
    roles(S).forEach((r) => { S.players[r].ready = false; });
    const alive = roles(S).filter((r) => S.players[r].lives > 0);
    if (isSolo(S)) {
      if (!alive.length) { S.phase = 'over'; S.reason = 'lives'; } else S.phase = 'result';
    } else if (alive.length < 2) {
      S.phase = 'over'; S.reason = 'lives'; S.winner = alive.length ? alive[0] : 'draw';
    } else S.phase = 'result';
  }

  function setReady(S, P, role) {
    if (!S.players[role]) return;
    if (S.phase === 'ready' || S.phase === 'result') {
      S.players[role].ready = true;
      const need = isSolo(S) ? ['host'] : ['host', 'guest'];
      if (need.every((r) => S.players[r] && S.players[r].ready)) startRound(S, P);
    } else if (S.phase === 'over' && S.reason !== 'leave' && S.reason !== 'quit') {
      S.players[role].ready = true; // хочет реванш
      if (roles(S).every((r) => S.players[r].ready)) {
        E.resetMemory();
        roles(S).forEach((r) => { S.players[r].lives = S.settings.lives; });
        S.history = []; S.round = 0; S.winner = null; S.reason = null;
        startRound(S, P);
      }
    }
  }

  function checkTimeout(S, P, isHost) {
    if (S.phase !== 'question' || !S.deadline) return false;
    const extra = isHost && !isSolo(S) ? GRACE : 150;
    if (Date.now() > S.deadline + extra) { finishRound(S, P); return true; }
    return false;
  }

  /* ======================================================================
     СЕССИИ: соло / хозяин / гость
     ====================================================================== */
  function myRole() { return app.game ? app.game.me : 'host'; }

  function commit() {
    const g = app.game;
    if (!g) return;
    if (g.mode === 'solo') {
      sess.set('egeduel:solo', { S: g.S, P: g.P });
    } else if (g.mode === 'host') {
      g.S.seq++;
      g.S.now = Date.now();
      if (g.link) g.link.send('state', g.S, { retain: true });
      store.set('egeduel:host:' + g.S.code, { S: g.S, P: g.P, t: Date.now() });
    }
    render();
  }

  // ---- соло ----
  function startSolo() {
    const st = validSettings(app.draft.solo);
    if (!st) return;
    E.resetMemory();
    const S = newState(st, app.name || 'Вы', null);
    const P = {};
    app.game = { mode: 'solo', me: 'host', S, P, ui: {} };
    sess.set('egeduel:active', { mode: 'solo' });
    startRound(S, P);
    app.tab = 'solo';
    commit();
    window.scrollTo(0, 0);
  }

  // ---- хозяин ----
  async function createRoom() {
    const st = validSettings(app.draft.duel);
    if (!st) return;
    if (!app.name.trim()) { toast('Введите своё имя'); $('#name-duel') && $('#name-duel').focus(); return; }
    app.busy = true; render();
    let link;
    try {
      link = await Net.host(onConn);
    } catch (e) {
      app.busy = false; render();
      toast(e && e.message === 'nolib' ? 'Не загрузилась библиотека связи. Проверьте интернет.' : 'Не удалось подключиться к серверу. Проверьте интернет и попробуйте ещё раз.');
      return;
    }
    app.busy = false;
    E.resetMemory();
    const S = newState(st, app.name.trim(), link.code);
    app.game = { mode: 'host', me: 'host', S, P: {}, link, ui: {}, oppOnline: false };
    bindHost(link);
    sess.set('egeduel:active', { mode: 'host', code: link.code });
    commit();
  }

  function bindHost(link) {
    const g = app.game;
    link.on('g2h', (m) => onGuestMsg(m));
    link.on('presence/guest', (v) => { g.oppOnline = v === '1'; render(); });
  }

  function onGuestMsg(m) {
    const g = app.game;
    if (!g || g.mode !== 'host' || !m || typeof m !== 'object') return;
    const S = g.S, P = g.P;
    if (m.type === 'ping') { g.link.send('h2g', { type: 'pong', t: m.t, h: Date.now(), pid: m.pid }, { qos: 0 }); return; }
    if (m.type === 'join') {
      if (!S.players.guest && S.phase === 'lobby') {
        S.players.guest = { pid: m.pid, name: String(m.name || 'Соперник').slice(0, 24), lives: S.settings.lives, answered: false, ready: false };
        S.phase = 'ready';
        g.oppOnline = true;
        toast((S.players.guest.name) + ' в игре!');
        commit();
      } else if (S.players.guest && S.players.guest.pid === m.pid) {
        g.oppOnline = true;
        commit(); // повторное подключение — просто отправим состояние
      }
      return;
    }
    if (!S.players.guest || m.pid !== S.players.guest.pid) return;
    if (m.type === 'answer' && m.round === S.round) { if (submitAnswer(S, P, 'guest', m.value)) commit(); else commit(); }
    else if (m.type === 'ready' && m.round === S.round) { setReady(S, P, 'guest'); commit(); }
    else if (m.type === 'leave') {
      if (S.phase !== 'over') { S.phase = 'over'; S.winner = 'host'; S.reason = 'leave'; }
      else S.reason = S.reason || 'left';
      g.oppLeft = true;
      commit();
    }
  }

  // ---- гость ----
  async function joinRoom(codeRaw) {
    const code = Net.normCode(codeRaw);
    app.joinCode = code;
    if (!Net.validCode(code)) { app.joinError = 'Код комнаты — 6 символов, например 2K7MQX.'; render(); return; }
    if (!app.name.trim()) { app.joinError = 'Введите своё имя.'; render(); return; }
    app.joinError = ''; app.busy = true; render();
    const pid = (sess.get('egeduel:active', {}) || {}).code === code ? sess.get('egeduel:active').pid : Net.rid(12);
    let link;
    try { link = await Net.join(code, onConn); }
    catch (e) {
      app.busy = false;
      app.joinError = e && e.message === 'nolib' ? 'Не загрузилась библиотека связи. Проверьте интернет.' : e && e.message === 'badcode' ? 'Неверный код комнаты.' : 'Не удалось подключиться к серверу. Проверьте интернет.';
      render(); return;
    }
    const g = { mode: 'guest', me: 'guest', S: null, link, pid, ui: {}, offset: 0, bestRtt: Infinity, oppOnline: true, joined: false };
    app.game = g;
    sess.set('egeduel:active', { mode: 'guest', code, pid });
    link.on('state', (S) => onState(S));
    link.on('h2g', (m) => {
      if (m && m.type === 'pong' && m.pid === pid) {
        const now = Date.now(), rtt = now - m.t;
        if (rtt < g.bestRtt + 30) { g.bestRtt = Math.min(g.bestRtt, rtt); g.offset = m.h - (m.t + rtt / 2); }
      }
    });
    link.on('presence/host', (v) => { g.oppOnline = v === '1'; render(); });
    const sendJoin = () => link.send('g2h', { type: 'join', pid, name: app.name.trim().slice(0, 24) });
    sendJoin();
    let n = 0;
    g.joinTimer = setInterval(() => {
      if (g.joined || app.game !== g) { clearInterval(g.joinTimer); return; }
      n++;
      sendJoin();
      if (n >= 6) {
        clearInterval(g.joinTimer);
        if (!g.joined) leaveGame(true, 'Комната не найдена или её создатель сейчас не в сети. Проверьте код.');
      }
    }, 2000);
    // синхронизация часов
    let pings = 0;
    const ping = () => { if (app.game !== g) return; link.send('g2h', { type: 'ping', pid, t: Date.now() }, { qos: 0 }); pings++; g.pingTimer = setTimeout(ping, pings < 4 ? 1500 : 15000); };
    ping();
    app.busy = false;
    app.tab = 'duel';
    render();
  }

  function onState(S) {
    const g = app.game;
    if (!g || g.mode !== 'guest' || !S || typeof S !== 'object' || !S.players) return;
    if (g.S && S.seq <= g.S.seq && S.code === g.S.code) return;
    if (S.players.guest && S.players.guest.pid !== g.pid) {
      if (!g.joined) leaveGame(true, 'В этой комнате уже идёт игра с другим участником.');
      return;
    }
    if (!S.players.guest) { g.S = S; render(); return; } // ещё не приняты
    if (!g.joined) { g.joined = true; toast('Вы в комнате'); }
    if (g.bestRtt === Infinity && S.now) g.offset = S.now - Date.now();
    g.S = S;
    // сбросим ожидающие действия, если хозяин их уже учёл
    const me = S.players.guest;
    if (g.ui.pendingAnswer && (g.ui.pendingAnswer.round !== S.round || me.answered || S.phase !== 'question')) g.ui.pendingAnswer = null;
    if (g.ui.pendingReady && (g.ui.pendingReady.round !== S.round || me.ready || g.ui.pendingReady.phase !== S.phase)) g.ui.pendingReady = null;
    render();
  }

  function guestSend(type, extra) {
    const g = app.game;
    const msg = Object.assign({ type, pid: g.pid, round: g.S.round }, extra || {});
    g.link.send('g2h', msg);
    return msg;
  }

  // повторная отправка, если хозяин не подтвердил
  setInterval(() => {
    const g = app.game;
    if (!g || g.mode !== 'guest' || !g.S) return;
    if (g.ui.pendingAnswer && Date.now() - g.ui.pendingAnswer.at > 2500) { g.link.send('g2h', g.ui.pendingAnswer.msg); g.ui.pendingAnswer.at = Date.now(); }
    if (g.ui.pendingReady && Date.now() - g.ui.pendingReady.at > 2500) { g.link.send('g2h', g.ui.pendingReady.msg); g.ui.pendingReady.at = Date.now(); }
  }, 500);

  // ---- действия игрока ----
  function doAnswer(value) {
    const g = app.game;
    if (!g) return;
    if (g.mode === 'guest') {
      if (g.S.phase !== 'question' || g.S.players.guest.answered || g.ui.pendingAnswer) return;
      const msg = guestSend('answer', { value: String(value) });
      g.ui.pendingAnswer = { round: g.S.round, msg, at: Date.now(), value: String(value) };
      g.ui.myValue = String(value);
      render();
      return;
    }
    g.ui.myValue = String(value);
    if (submitAnswer(g.S, g.P, 'host', value)) commit();
  }

  function doReady() {
    const g = app.game;
    if (!g) return;
    if (g.mode === 'guest') {
      if (g.S.players.guest.ready || g.ui.pendingReady) return;
      const msg = guestSend('ready');
      g.ui.pendingReady = { round: g.S.round, phase: g.S.phase, msg, at: Date.now() };
      render();
      return;
    }
    setReady(g.S, g.P, 'host');
    g.ui.showFull = false;
    commit();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function leaveGame(silent, reasonMsg) {
    const g = app.game;
    if (!g) return;
    const S = g.S;
    if (!silent) {
      const inPlay = S && S.phase !== 'over' && S.phase !== 'lobby' && g.mode !== 'solo';
      const q = g.mode === 'solo' ? (S.phase === 'over' ? null : 'Завершить игру?') : inPlay ? 'Выйти из дуэли? Это будет засчитано как поражение.' : null;
      if (q && !confirm(q)) return;
    }
    clearInterval(g.joinTimer); clearTimeout(g.pingTimer);
    if (g.mode === 'host') {
      if (S.phase === 'lobby' || S.phase === 'over') { g.link.clear('state'); }
      else { S.phase = 'over'; S.winner = 'guest'; S.reason = 'leave'; S.seq++; S.now = Date.now(); g.link.send('state', S, { retain: true }); }
      store.del('egeduel:host:' + S.code);
      g.link.close();
    } else if (g.mode === 'guest') {
      if (S && S.players && S.players.guest && S.players.guest.pid === g.pid) g.link.send('g2h', { type: 'leave', pid: g.pid });
      g.link.close();
    } else if (g.mode === 'solo' && S.phase !== 'over' && !silent) {
      // соло: показать итоги
      S.phase = 'over'; S.reason = 'quit'; S.deadline = 0;
      sess.del('egeduel:active'); sess.del('egeduel:solo');
      render();
      return;
    }
    sess.del('egeduel:active'); sess.del('egeduel:solo');
    app.game = null;
    if (reasonMsg) { app.joinError = reasonMsg; app.tab = 'duel'; }
    render();
  }

  function onConn(ok) {
    const el = $('#conn');
    if (el) el.classList.toggle('show', !ok && !!app.game && app.game.mode !== 'solo');
    if (ok && app.game && app.game.mode === 'host') setTimeout(() => commit(), 100);
    if (ok && app.game && app.game.mode === 'guest' && app.game.link) {
      app.game.link.send('g2h', { type: 'join', pid: app.game.pid, name: app.name.trim().slice(0, 24) });
    }
  }

  // ---- восстановление после перезагрузки страницы ----
  async function resume() {
    const a = sess.get('egeduel:active', null);
    if (!a) return;
    if (a.mode === 'solo') {
      const d = sess.get('egeduel:solo', null);
      if (d && d.S) { app.game = { mode: 'solo', me: 'host', S: d.S, P: d.P || {}, ui: {} }; app.tab = 'solo'; render(); }
      return;
    }
    if (a.mode === 'host') {
      const d = store.get('egeduel:host:' + a.code, null);
      if (!d || !d.S) { sess.del('egeduel:active'); return; }
      try {
        const link = await Net.hostExisting(a.code, onConn);
        app.game = { mode: 'host', me: 'host', S: d.S, P: d.P || {}, link, ui: {}, oppOnline: false };
        bindHost(link);
        app.tab = 'duel';
        commit();
        toast('Игра восстановлена');
      } catch (e) { toast('Не удалось восстановить комнату'); }
      return;
    }
    if (a.mode === 'guest') { app.tab = 'duel'; joinRoom(a.code); }
  }

  /* ---------- настройки ---------- */
  function validSettings(d) {
    const st = { time: Math.max(0, Math.min(3600, Math.round(+d.time || 0))), lives: Math.max(1, Math.min(10, Math.round(+d.lives || 3))), mode: d.mode === 'pick' ? 'pick' : 'all', nums: (d.nums || []).filter((x) => x >= 1 && x <= 19), order: d.order === 'seq' ? 'seq' : 'random' };
    if (st.mode === 'pick' && !st.nums.length) { toast('Выберите хотя бы один номер задания'); return null; }
    return st;
  }

  function settingsHTML(key) {
    const d = app.draft[key];
    const custom = TIME_OPTS.indexOf(+d.time) < 0;
    let s = '';
    s += `<div class="field"><span class="lbl">Время на ответ</span><div class="chips">`;
    TIME_OPTS.forEach((v) => { s += `<button type="button" class="chip ${+d.time === v ? 'on' : ''}" data-set="time" data-v="${v}">${v ? v / 60 + ' мин' : 'Без лимита'}</button>`; });
    s += `<button type="button" class="chip ${custom ? 'on' : ''}" data-set="time-custom">Своё…</button></div>`;
    s += `<div class="row ${custom ? '' : 'hide'}" style="margin-top:8px"><input class="input" style="max-width:110px" type="number" min="1" max="60" data-set="time-min" value="${custom ? Math.round(d.time / 60) || 1 : 5}"> <span class="muted">минут</span></div>`;
    s += `<div class="hint">Если игрок не успел ответить, он теряет жизнь. Для заданий 13–19 обычно нужно 10–20 минут.</div></div>`;
    s += `<div class="field"><span class="lbl">Количество жизней</span><div class="stepper"><button type="button" data-set="lives-" aria-label="Меньше">−</button><span>${d.lives} ${livesWord(d.lives)}</span><button type="button" data-set="lives+" aria-label="Больше">+</button></div></div>`;
    s += `<div class="field"><span class="lbl">Задания</span><div class="seg"><button type="button" class="${d.mode === 'all' ? 'on' : ''}" data-set="mode" data-v="all">Все вперемешку</button><button type="button" class="${d.mode === 'pick' ? 'on' : ''}" data-set="mode" data-v="pick">Выбрать номера</button></div>`;
    if (d.mode === 'pick') {
      s += `<div class="nums" style="margin-top:12px">`;
      ALL.forEach((n) => { s += `<button type="button" class="num ${n > 12 ? 'p2' : ''} ${d.nums.indexOf(n) >= 0 ? 'on' : ''}" data-set="num" data-v="${n}" title="${esc(E.NUM_TITLES[n])}">${n}</button>`; });
      s += `</div><div class="row" style="margin-top:10px"><button type="button" class="link" data-set="preset" data-v="p1">Часть 1 (1–12)</button><span class="muted">·</span><button type="button" class="link" data-set="preset" data-v="p2">Часть 2 (13–19)</button><span class="muted">·</span><button type="button" class="link" data-set="preset" data-v="none">Снять все</button></div>`;
      s += `<div class="row" style="margin-top:12px"><span class="muted" style="font-size:14px">Порядок:</span><div class="seg"><button type="button" class="${d.order !== 'seq' ? 'on' : ''}" data-set="order" data-v="random">Случайно</button><button type="button" class="${d.order === 'seq' ? 'on' : ''}" data-set="order" data-v="seq">По возрастанию</button></div></div>`;
      s += `<div class="hint">Выбрано: ${d.nums.length ? '№ ' + compress(d.nums) : 'ничего'}</div>`;
    } else {
      s += `<div class="hint">Каждый раунд — случайный номер от 1 до 19.</div>`;
    }
    s += `</div>`;
    return s;
  }

  function onSettingsClick(key, el) {
    const d = app.draft[key];
    const k = el.dataset.set, v = el.dataset.v;
    if (k === 'time') d.time = +v;
    else if (k === 'time-custom') { if (TIME_OPTS.indexOf(+d.time) >= 0) d.time = 420; }
    else if (k === 'lives-') d.lives = Math.max(1, d.lives - 1);
    else if (k === 'lives+') d.lives = Math.min(10, d.lives + 1);
    else if (k === 'mode') d.mode = v;
    else if (k === 'order') d.order = v;
    else if (k === 'num') { const n = +v; const i = d.nums.indexOf(n); if (i >= 0) d.nums.splice(i, 1); else d.nums.push(n); }
    else if (k === 'preset') d.nums = v === 'p1' ? ALL.slice(0, 12) : v === 'p2' ? ALL.slice(12) : [];
    else return;
    store.set('egeduel:set:' + key, d);
    render();
  }

  /* ======================================================================
     ОТРИСОВКА
     ====================================================================== */
  const main = () => $('#main');

  function render() {
    $$('nav.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === app.tab));
    const g = app.game;
    const gameTab = g ? (g.mode === 'solo' ? 'solo' : 'duel') : null;
    if (g && app.tab === gameTab) { renderGame(); return; }
    app.rendered = null;
    if (app.tab === 'duel') renderDuelHome();
    else if (app.tab === 'solo') renderSoloHome();
    else renderRules();
  }

  function activeGameBanner(tab) {
    const g = app.game;
    if (!g) return '';

  function bindCommon() {
    $$('[data-name]').forEach((inp) => inp.addEventListener('input', (e) => { app.name = e.target.value; store.set('egeduel:name', app.name); }));
    $$('[data-go]').forEach((b) => (b.onclick = () => { app.tab = b.dataset.go; render(); }));
    $$('section.card').forEach((card) => {
      card.addEventListener('click', (e) => {
        const el = e.target.closest('[data-set]');
        if (!el || el.tagName === 'INPUT') return;
        const key = card.querySelector('#create') ? 'duel' : 'solo';
        onSettingsClick(key, el);
      });
      card.addEventListener('change', (e) => {
        const el = e.target.closest('[data-set="time-min"]');
        if (!el) return;
        const key = card.querySelector('#create') ? 'duel' : 'solo';
        const m = Math.max(1, Math.min(60, Math.round(+el.value || 1)));
        app.draft[key].time = m * 60;
        store.set('egeduel:set:' + key, app.draft[key]);
        render();
      });
    });
  }

  /* ---------- экран игры ---------- */
  function names(S) {
    const me = myRole(), opp = me === 'host' ? 'guest' : 'host';
    return { me, opp, meP: S.players[me], oppP: S.players[opp] };
  }

  function renderGame() {
    const g = app.game, S = g.S;
    if (!S) {
      main().innerHTML = `<div class="card" style="text-align:center;padding:40px"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Подключаемся к комнате ${esc(g.link ? g.link.code : '')}…</div><div class="actions" style="justify-content:center"><button class="btn ghost" id="leave">Отмена</button></div></div>`;
      $('#leave').onclick = () => leaveGame(true);
      return;
    }
    if (g.mode === 'guest' && !S.players.guest) {
      main().innerHTML = `<div class="card" style="text-align:center;padding:40px"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Входим в комнату ${esc(S.code)}…</div><div class="actions" style="justify-content:center"><button class="btn ghost" id="leave">Отмена</button></div></div>`;
      $('#leave').onclick = () => leaveGame(true);
      return;
    }
    if (S.phase === 'lobby') return renderLobby();
    const key = [S.code, S.phase, S.round].join('|');
    if (app.rendered !== key) {
      if (g.ui.lastKeyRound !== S.round) { g.ui.draft = ''; g.ui.lastKeyRound = S.round; }
      app.rendered = key;
      g.ui.showFull = false;
      main().innerHTML = `<div id="hud"></div><div id="tbar"></div><div id="body"></div>`;
      renderBody();
      window.scrollTo({ top: 0 });
    } else {
      patchBody();
    }
    renderHud();
  }

  function renderLobby() {
    const g = app.game, S = g.S;
    app.rendered = null;
    const url = location.href.split('?')[0].split('#')[0] + '?room=' + S.code;
    const local = location.protocol === 'file:';
    main().innerHTML = `
      <div class="grid2">
        <section class="card">
          <h2>Комната создана</h2>
          <div class="code-box">
